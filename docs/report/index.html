<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX Review — BOLD700</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 238 245'><path fill='%23ff5003' d='M194.252 118.59C207.964 113.052 218.412 104.907 226.247 94.1556C234.082 83.4043 238 70.6981 238 55.7114C238 37.7926 230.818 23.7832 216.453 14.3351C202.741 5.21277 183.805 0.325798 158.993 0H0V61.25H46.3594V46.2633H88.8011L0 245H116.878C150.178 245 176.949 238.484 197.191 225.452C217.432 212.42 227.226 193.198 227.226 167.786C227.226 155.731 224.288 145.957 218.738 137.487C213.188 129.016 205.026 122.826 194.252 118.59ZM157.687 193.198C148.872 199.388 136.466 202.32 120.469 202.32H69.5391L96.6365 141.722H134.181C158.667 141.722 171.073 150.193 171.073 166.809C171.073 178.537 166.502 187.008 157.687 193.198ZM166.176 92.2008C158.014 97.7394 146.261 100.672 131.243 100.672H114.919L139.078 46.5891H142.669C166.829 46.5891 178.908 53.7566 178.908 68.0918C178.582 78.5173 174.337 86.6622 166.176 92.2008Z'/></svg>">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../review-tool/modules/module-data.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:#f4f4f5;line-height:1.55}
  a{color:#ff5003}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:#111;color:#fff}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
  .topbar .brand svg{height:24px}
  .topbar .cta{background:#ff5003;color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px}
  .wrap{max-width:820px;margin:28px auto;padding:0 16px}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,.07);padding:36px 40px}
  .rep-head{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid #eee;padding-bottom:20px;margin-bottom:24px}
  .rep-brand .t{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#888}
  .rep-brand h1{font-size:22px;margin:2px 0 0}
  .rep-meta{font-size:13px;color:#666;margin-top:4px}
  .rep-score{text-align:center;flex-shrink:0}
  .rep-score .n{font-size:38px;font-weight:800;line-height:1}
  .rep-score .l{font-size:11px;text-transform:uppercase;color:#999;letter-spacing:.5px}
  h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.5px;margin:28px 0 12px}
  .item{border:1px solid #eee;border-left:4px solid #ddd;border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .item-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .q{font-weight:600;font-size:14px}
  .cat{font-size:11px;color:#888;background:#f4f4f5;padding:2px 8px;border-radius:20px}
  .note{font-size:13px;color:#444;margin-top:6px;white-space:pre-wrap}
  .imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .imgs img{max-width:200px;max-height:150px;border-radius:6px;border:1px solid #eee;cursor:zoom-in}
  .empty{color:#999;font-size:13px}
  .ai{background:#faf9ff;border:1px solid #ece8ff;border-radius:10px;padding:16px 18px}
  .ai h2,.ai h3{margin:12px 0 6px} .ai h2{font-size:16px} .ai h3{font-size:14px} .ai p,.ai li{font-size:13px}
  .foot{margin-top:28px;text-align:center;color:#777;font-size:13px}
  .foot .big{display:inline-block;margin-top:8px;background:#111;color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:10px}
  .state{max-width:520px;margin:80px auto;text-align:center;color:#555}
  .state svg{height:44px;margin-bottom:16px}
  .state h2{margin:0 0 8px;color:#1a1a1a}
  @media(max-width:600px){.card{padding:24px 18px}.rep-head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../" style="color:#fff;text-decoration:none">
    <svg viewBox="0 0 238 245"><path fill="#ff5003" d="M194.252 118.59C207.964 113.052 218.412 104.907 226.247 94.1556C234.082 83.4043 238 70.6981 238 55.7114C238 37.7926 230.818 23.7832 216.453 14.3351C202.741 5.21277 183.805 0.325798 158.993 0H0V61.25H46.3594V46.2633H88.8011L0 245H116.878C150.178 245 176.949 238.484 197.191 225.452C217.432 212.42 227.226 193.198 227.226 167.786C227.226 155.731 224.288 145.957 218.738 137.487C213.188 129.016 205.026 122.826 194.252 118.59ZM157.687 193.198C148.872 199.388 136.466 202.32 120.469 202.32H69.5391L96.6365 141.722H134.181C158.667 141.722 171.073 150.193 171.073 166.809C171.073 178.537 166.502 187.008 157.687 193.198ZM166.176 92.2008C158.014 97.7394 146.261 100.672 131.243 100.672H114.919L139.078 46.5891H142.669C166.829 46.5891 178.908 53.7566 178.908 68.0918C178.582 78.5173 174.337 86.6622 166.176 92.2008Z"/></svg>
    BOLD700 · UX Review
  </a>
  <a class="cta" href="../review-tool/">Zelf een review doen →</a>
</div>

<div id="root">
  <div class="state"><p>Rapport laden…</p></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPQdEZk574PO7ft7aHTSPjzxwgSXFtf-o",
    authDomain: "bold700-ux-reviews.firebaseapp.com",
    projectId: "bold700-ux-reviews",
    storageBucket: "bold700-ux-reviews.firebasestorage.app",
    messagingSenderId: "61806362887",
    appId: "1:61806362887:web:8e0667d1d01119279fc5a2"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const FF_CAT_LABELS = {
    usability: 'Usability', visual: 'Visueel Design', content: 'Content & Copy',
    conversion: 'Conversie', technical: 'Technisch', ia: 'Navigatie & IA',
    trust: 'Vertrouwen', other: 'Overig'
  };

  const esch = s => (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cleanNote = s => (s || '').replace(/\[(Auto-scan|AI)\]\s*/g, '').trim();

  function imagesFor(a) {
    if (a.screenshots && Array.isArray(a.screenshots) && a.screenshots.length) return a.screenshots;
    if (a.screenshotUrls && Array.isArray(a.screenshotUrls) && a.screenshotUrls.length) return a.screenshotUrls;
    if (a.screenshot) return [a.screenshot];
    return [];
  }

  // Compacte markdown → HTML voor het AI-actieplan
  function md2html(md) {
    let h = (md || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>[\s\S]*?<\/li>)/g, m => '<ul>' + m + '</ul>').replace(/<\/ul>\s*<ul>/g, '');
    h = h.split(/\n{2,}/).map(b => /^\s*<(h2|h3|ul|li)/.test(b.trim()) ? b : (b.trim() ? '<p>' + b.trim().replace(/\n/g, '<br>') + '</p>' : '')).join('\n');
    return h;
  }

  function buildItems(project) {
    const answers = project.answers || {};
    const issues = [], strengths = [];
    const push = (it) => (it.score === 'bad' || it.score === 'ok' ? issues : strengths).push(it);

    if (project.reviewType === 'free-form') {
      Object.keys(answers).filter(k => k.startsWith('ff-')).forEach(fId => {
        const a = answers[fId]; if (!a || !a.score) return;
        const cats = a.findingCategories || (a.findingCategory ? [a.findingCategory] : []);
        const cat = cats.map(c => FF_CAT_LABELS[c] || c).join(', ') || 'Overig';
        const label = a.findingTitle || (a.notes || '').split('\n')[0].substring(0, 80) || 'Bevinding';
        push({ category: cat, question: label, score: a.score, notes: a.notes || '', images: imagesFor(a) });
      });
    } else {
      let steps = [];
      try {
        const cfg = project.moduleConfig || (typeof getDefaultModuleConfig === 'function' ? getDefaultModuleConfig() : null);
        steps = (typeof buildReviewSteps === 'function') ? buildReviewSteps(cfg) : [];
      } catch (e) { steps = []; }
      steps.forEach(step => step.questions.forEach(q => {
        const a = answers[q.id]; if (!a || !a.score || a.score === 'nvt') return;
        push({ category: step.shortTitle, question: q.text, score: a.score, notes: a.notes || '', images: imagesFor(a) });
      }));
    }
    return { issues, strengths };
  }

  function scoreOf(project) {
    const ans = project.answers || {};
    const ids = Object.keys(ans);
    const nvt = ids.filter(k => ans[k].score === 'nvt').length;
    const scored = ids.filter(k => ans[k].score && ans[k].score !== 'nvt');
    const eff = ids.length - nvt;
    if (eff === 0) return null;
    const sum = scored.reduce((s, k) => s + (ans[k].score === 'good' ? 10 : ans[k].score === 'ok' ? 6 : 3), 0);
    return sum / eff;
  }

  function stateHtml(icon, title, msg) {
    return `<div class="state">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
      <h2>${title}</h2><p>${msg}</p>
      <p style="margin-top:20px"><a class="cta" href="../review-tool/" style="text-decoration:none;padding:10px 18px;border-radius:10px;background:#111;color:#fff">Naar het platform →</a></p>
    </div>`;
  }

  function render(project) {
    const dot = { good: '#22c55e', ok: '#eab308', bad: '#ef4444' };
    const { issues, strengths } = buildItems(project);
    const score = scoreOf(project);
    const scoreColor = score == null ? '#888' : score >= 7.5 ? '#22c55e' : score >= 5 ? '#eab308' : '#ef4444';
    const dateStr = new Date(project.createdAt || project.updatedAt || Date.now()).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
    const title = project.name || project.url || 'UX Review';

    const item = it => `<div class="item">
      <div class="item-head"><span class="dot" style="background:${dot[it.score] || '#888'}"></span><span class="q">${esch(it.question)}</span>${it.category ? `<span class="cat">${esch(it.category)}</span>` : ''}</div>
      ${cleanNote(it.notes) ? `<div class="note">${esch(cleanNote(it.notes))}</div>` : ''}
      ${it.images.length ? `<div class="imgs">${it.images.map(s => `<img src="${esch(s)}" alt="" onclick="window.open(this.src,'_blank')">`).join('')}</div>` : ''}
    </div>`;

    document.getElementById('root').innerHTML = `<div class="wrap"><div class="card">
      <div class="rep-head">
        <div class="rep-brand">
          <div class="t">UX Review rapport</div>
          <h1>${esch(title)}</h1>
          <div class="rep-meta">${esch(project.url || '')}${project.client ? ' · ' + esch(project.client) : ''} · ${dateStr}</div>
        </div>
        ${score != null ? `<div class="rep-score"><div class="n" style="color:${scoreColor}">${score.toFixed(1)}</div><div class="l">Score</div></div>` : ''}
      </div>
      ${project.aiPlan ? `<h2 class="sec">✨ Samenvatting &amp; Actieplan</h2><div class="ai">${md2html(project.aiPlan)}</div>` : ''}
      <h2 class="sec" style="color:#16a34a">✓ Sterke punten (${strengths.length})</h2>
      ${strengths.length ? strengths.map(item).join('') : '<p class="empty">Geen expliciete sterke punten genoteerd.</p>'}
      <h2 class="sec" style="color:#dc2626">⚠ Verbeterpunten (${issues.length})</h2>
      ${issues.length ? issues.map(item).join('') : '<p class="empty">Geen verbeterpunten — netjes!</p>'}
      <div class="foot">
        Dit rapport is live op het BOLD700-platform en altijd actueel.<br>
        <a class="big" href="../review-tool/">Zelf een UX review doen →</a>
      </div>
    </div></div>`;
    document.title = 'UX Review — ' + title + ' · BOLD700';
  }

  (async function () {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) {
      document.getElementById('root').innerHTML = stateHtml('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', 'Geen rapport opgegeven', 'Deze link mist een rapport-id.');
      return;
    }
    try {
      const doc = await db.collection('projects').doc(id).get();
      if (!doc.exists) {
        document.getElementById('root').innerHTML = stateHtml('<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>', 'Rapport niet gevonden', 'Dit rapport bestaat niet of is verwijderd.');
        return;
      }
      const project = { id: doc.id, ...doc.data() };
      if (!project.public) {
        document.getElementById('root').innerHTML = stateHtml('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', 'Rapport niet gedeeld', 'De eigenaar heeft dit rapport (nog) niet openbaar gemaakt.');
        return;
      }
      if (project.shareExpiresAtMs && Date.now() > project.shareExpiresAtMs) {
        document.getElementById('root').innerHTML = stateHtml('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', 'Deellink verlopen', 'De deelperiode van dit rapport is voorbij. Vraag de eigenaar om een nieuwe link.');
        return;
      }
      render(project);
    } catch (e) {
      console.error(e);
      document.getElementById('root').innerHTML = stateHtml('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', 'Rapport niet (meer) beschikbaar', 'De deellink is mogelijk verlopen of ingetrokken. Vraag de eigenaar om een nieuwe link.');
    }
  })();
</script>
</body>
</html>
